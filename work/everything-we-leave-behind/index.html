<section class="case-study" id="caseStudy"
  aria-hidden="true"
  role="dialog"
  aria-modal="true"
  aria-labelledby="caseTitle">

  <header class="case-topbar">
    <span class="case-label" id="caseLabel">Unmoved — Case study</span>
    <button class="case-close" type="button">×</button>
  </header>

  <div class="case-hero">
    <img id="caseImage" src="" alt="">
    <div class="case-hero-title">
      <div class="case-category" id="caseCategory"></div>
      <h2 id="caseTitle"></h2>
    </div>
  </div>

  <div class="case-content">
    <div class="case-lede-grid">
      <p class="case-lede" id="caseDescription"></p>
      <div class="case-facts">
        <div class="case-fact">
          <span>Year</span><strong id="caseYear"></strong>
        </div>
        <div class="case-fact">
          <span>Studio role</span><strong id="caseRole"></strong>
        </div>
        <div class="case-fact">
          <span>Services</span><strong id="caseServices"></strong>
        </div>
      </div>
    </div>

    <div class="case-story">
      <p id="caseStory"></p>
    </div>

    <div class="case-end">
      <span>More work, made with care.</span>
      <button class="case-end-close">
        Back to selected work ↖
      </button>
    </div>
  </div>
</section>
